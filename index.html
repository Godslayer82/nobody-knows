<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Videos</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: sans-serif;
        }

        .video-container {
            position: absolute;
            width: 50px; /* Adjust size of the videos here */
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            background: #000;
            overflow: hidden;
        }

        video {
            width: 100%;
            display: block;
            pointer-events: none; /* Prevents click interference */
        }
    </style>
</head>
<body>

<script>
    const VIDEO_SRC = 'B3A0A942-C0F6-409B-A9D4-C9633DA111E1.mov';
    const NUMBER_OF_VIDEOS = 5; // Change this to add more or fewer videos
    const SPEED_MODIFIER = 3;  // Adjust speed of the bounce
    const containers = [];

    // Initialize the bouncing video elements
    for (let i = 0; i < NUMBER_OF_VIDEOS; i++) {
        const container = document.createElement('div');
        container.className = 'video-container';

        const video = document.createElement('video');
        video.src = VIDEO_SRC;
        video.autoplay = true;
        video.loop = true;
        video.muted = true;
        video.playsInline = true;

        container.appendChild(video);
        document.body.appendChild(container);

        // Random starting positions and velocities
        const size = 250; 
        const x = Math.random() * (window.innerWidth - size);
        const y = Math.random() * (window.innerHeight - size);
        
        // Random directions (-1 or 1) multiplied by speed
        const vx = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 2 + 1) * SPEED_MODIFIER;
        const vy = (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 2 + 1) * SPEED_MODIFIER;

        containers.push({
            element: container,
            x: x,
            y: y,
            vx: vx,
            vy: vy,
            width: size,
            height: size * (9/16), // Assumes 16:9, will auto-adjust dynamically later
            mass: 1 // Used for collision physics
        });
    }

    // Unmute on click feature (Browsers block autoplay audio)
    window.addEventListener('click', () => {
        document.querySelectorAll('video').forEach(v => v.muted = false);
    }, { once: true });

    function updatePhysics() {
        const width = window.innerWidth;
        const height = window.innerHeight;

        // 1. Update positions & Wall Collisions
        containers.forEach(c => {
            // Update actual height based on rendered video element
            c.height = c.element.offsetHeight || 140; 

            c.x += c.vx;
            c.y += c.vy;

            // Bounce off left/right walls
            if (c.x <= 0) {
                c.x = 0;
                c.vx *= -1;
            } else if (c.x + c.width >= width) {
                c.x = width - c.width;
                c.vx *= -1;
            }

            // Bounce off top/bottom walls
            if (c.y <= 0) {
                c.y = 0;
                c.vy *= -1;
            } else if (c.y + c.height >= height) {
                c.y = height - c.height;
                c.vy *= -1;
            }
        });

        // 2. Handle Box-to-Box Collisions (Elastic Collision Physics)
        for (let i = 0; i < containers.length; i++) {
            for (let j = i + 1; j < containers.length; j++) {
                const c1 = containers[i];
                const c2 = containers[j];

                // AABB (Axis-Aligned Bounding Box) Overlap Check
                if (c1.x < c2.x + c2.width &&
                    c1.x + c1.width > c2.x &&
                    c1.y < c2.y + c2.height &&
                    c1.y + c1.height > c2.y) {

                    // Calculate overlap on both axes
                    const overlapX = Math.min(c1.x + c1.width, c2.x + c2.width) - Math.max(c1.x, c2.x);
                    const overlapY = Math.min(c1.y + c1.height, c2.y + c2.height) - Math.max(c1.y, c2.y);

                    // Push them apart and reverse velocity on the shallowest collision axis
                    if (overlapX < overlapY) {
                        if (c1.x < c2.x) {
                            c1.x -= overlapX / 2;
                            c2.x += overlapX / 2;
                        } else {
                            c1.x += overlapX / 2;
                            c2.x -= overlapX / 2;
                        }
                        // Swap X velocities
                        const tempVx = c1.vx;
                        c1.vx = c2.vx;
                        c2.vx = tempVx;
                    } else {
                        if (c1.y < c2.y) {
                            c1.y -= overlapY / 2;
                            c2.y += overlapY / 2;
                        } else {
                            c1.y += overlapY / 2;
                            c2.y -= overlapY / 2;
                        }
                        // Swap Y velocities
                        const tempVy = c1.vy;
                        c1.vy = c2.vy;
                        c2.vy = tempVy;
                    }
                }
            }
        }

        // 3. Render the elements
        containers.forEach(c => {
            c.element.style.transform = `translate3d(${c.x}px, ${c.y}px, 0)`;
        });

        requestAnimationFrame(updatePhysics);
    }

    // Start the loop
    requestAnimationFrame(updatePhysics);
</script>

</body>
</html>
